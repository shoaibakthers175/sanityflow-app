services:
  # Option 1: Static Site (Recommended & Free on Render)
  - type: web
    name: sanityflow-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

